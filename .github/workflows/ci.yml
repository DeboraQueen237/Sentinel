name: SENTINEL CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SENTINEL_DATA_DIR: ${{ runner.temp }}\sentinel-ci

jobs:
  build-and-test:
    name: Build & Test (.NET 10 / Windows)
    runs-on: windows-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restauration des dépendances NuGet
        run: dotnet restore Sentinel.slnx

      - name: Compilation de la solution
        run: dotnet build Sentinel.slnx --configuration Release --no-restore

      - name: Exécution des tests unitaires et d'intégration
        run: dotnet test Sentinel.slnx --configuration Release --no-restore --verbosity normal --logger "trx;LogFileName=sentinel-tests.trx" --results-directory TestResults

      - name: Publication des résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
