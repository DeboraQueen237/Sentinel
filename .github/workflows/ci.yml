name: SENTINEL CI & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SENTINEL_DATA_DIR: ${{ runner.temp }}\sentinel-ci

jobs:
  build-and-test:
    name: Build & Test (.NET 10 / Windows)
    runs-on: windows-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restauration des dépendances NuGet
        run: dotnet restore Sentinel.slnx

      - name: Vérification vulnérabilités NuGet
        run: dotnet list Sentinel.slnx package --vulnerable --include-transitive

      - name: Compilation de la solution (Release)
        run: dotnet build Sentinel.slnx --configuration Release --no-restore

      - name: Exécution des tests unitaires et d'intégration
        run: dotnet test Sentinel.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=sentinel-tests.trx" --results-directory TestResults

      - name: Publication des résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  package-release:
    name: Package Windows x64 (WiX v5 MSI + Portable ZIP)
    runs-on: windows-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Construction du MSI WiX v5, de l'archive portable et des SHA-256
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "2.0.0" }
          .\build\build.ps1 -Version $ver -Restore -SkipTests

      - name: Publication des artefacts de distribution (MSI + Portable ZIP + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-x64-dist
          path: |
            dist/SentinelSetup-*.msi
            dist/SentinelPortable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
