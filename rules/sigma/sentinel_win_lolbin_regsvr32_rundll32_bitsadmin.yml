title: Suspicious Regsvr32, Rundll32 or Bitsadmin Proxy Execution
id: 6a100005-5e77-4b21-9c05-000000000005
status: stable
description: Detects LOLBin abuse involving regsvr32.exe (Squiblydoo scriptlet), rundll32.exe (inline script or untrusted path DLL), or bitsadmin.exe file transfers.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_regsvr32:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains:
            - 'scrobj.dll'
            - 'http://'
            - 'https://'
            - '/i:http'
            - '-i:http'
    selection_rundll32:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'javascript:'
            - 'vbscript:'
            - 'mshtml,RunHTMLApplication'
            - 'url.dll,OpenURL'
            - 'pcwutl.dll,LaunchApplication'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\Users\Public\'
    selection_bitsadmin:
        Image|endswith: '\bitsadmin.exe'
        CommandLine|contains|windash:
            - ' /transfer'
            - ' /addfile'
            - ' /create'
            - ' /setnotifycmdline'
    condition: 1 of selection_*
falsepositives:
    - Legitimate installers registering temporary COM components or using BITS transfers
level: high
tags:
    - attack.defense_evasion
    - attack.command_and_control
    - attack.t1218.010
    - attack.t1218.011
    - attack.t1197
