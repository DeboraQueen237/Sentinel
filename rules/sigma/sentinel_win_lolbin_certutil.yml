# License: MIT — Original rule authored for SENTINEL v2
title: Certutil Suspicious Download or Payload Decoding
id: 6a100004-5e77-4b21-9c04-000000000004
status: stable
description: Detects abuse of certutil.exe to download remote files (-urlcache/-verifyctl) or decode obfuscated payloads (-decode/-decodehex).
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\certutil.exe'
    selection_args:
        CommandLine|contains|windash:
            - ' -urlcache'
            - ' -verifyctl'
            - ' -decode'
            - ' -decodehex'
            - ' -encode'
    filter_verify_only:
        CommandLine|contains|windash:
            - ' -verify '
    condition: selection_img and selection_args and not filter_verify_only
falsepositives:
    - Certificate administrators manually decoding PEM/DER certificate bundles
level: high
tags:
    - attack.defense_evasion
    - attack.command_and_control
    - attack.t1105
    - attack.t1140
