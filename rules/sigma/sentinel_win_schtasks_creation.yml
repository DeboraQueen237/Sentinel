title: Scheduled Task Creation via Schtasks
id: 6a100008-5e77-4b21-9c08-000000000008
status: stable
description: Detects creation or modification of Windows Scheduled Tasks via schtasks.exe, commonly abused to establish persistence or elevate privileges.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_create:
        CommandLine|contains|windash:
            - ' /create'
    selection_suspicious_payload:
        CommandLine|contains:
            - 'powershell'
            - 'pwsh'
            - 'cmd.exe'
            - 'mshta'
            - 'wscript'
            - 'cscript'
            - 'rundll32'
            - 'regsvr32'
            - '\Temp\'
            - '\AppData\'
            - '\Users\Public\'
            - '\ProgramData\'
            - 'http://'
            - 'https://'
    filter_system_maintenance:
        CommandLine|contains:
            - '\Microsoft\Windows\'
    condition: selection_img and selection_create and selection_suspicious_payload and not filter_system_maintenance
falsepositives:
    - Administrative deployment scripts scheduling PowerShell maintenance jobs
level: medium
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053
    - attack.t1053.005
