title: Volume Shadow Copy Deletion or Recovery Inhibition
id: 6a100011-5e77-4b21-9c11-000000000011
status: stable
description: Detects deletion of Volume Shadow Copies or disabling of Windows recovery via vssadmin, wmic, wbadmin, bcdedit or PowerShell, a high-confidence ransomware indicator.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    selection_wbadmin:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'catalog'
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains|all:
            - 'recoveryenabled'
            - 'no'
    selection_ps_shadow:
        CommandLine|contains|all:
            - 'Win32_ShadowCopy'
            - 'Delete'
    condition: 1 of selection_*
falsepositives:
    - Rare backup maintenance scripts pruning obsolete shadow storage manually
level: critical
tags:
    - attack.impact
    - attack.t1490
