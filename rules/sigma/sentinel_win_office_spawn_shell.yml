title: Microsoft Office Application Spawning Command or Script Interpreter
id: 6a100014-5e77-4b21-9c14-000000000014
status: stable
description: Detects Microsoft Office applications (Word, Excel, PowerPoint, Outlook, Access) spawning command shells or LOLBins, a classic indicator of malicious macros or exploits.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_office_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\visio.exe'
    selection_shell_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\certutil.exe'
            - '\bitsadmin.exe'
    condition: selection_office_parent and selection_shell_child
falsepositives:
    - Legacy enterprise Office add-ins or VBA automations invoking local scripts
level: high
tags:
    - attack.execution
    - attack.initial_access
    - attack.t1204.002
    - attack.t1059
