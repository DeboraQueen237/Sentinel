title: PowerShell Download Cradle Execution
id: 6a100002-5e77-4b21-9c02-000000000002
status: stable
description: Detects PowerShell download cradles using WebClient, Invoke-WebRequest, Invoke-RestMethod or Start-BitsTransfer to fetch and execute remote payloads in memory.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_webclient:
        CommandLine|contains:
            - 'DownloadString'
            - 'DownloadFile'
            - 'DownloadData'
            - 'Net.WebClient'
            - 'Start-BitsTransfer'
    selection_http:
        CommandLine|contains:
            - 'http://'
            - 'https://'
    selection_iwr_exec:
        CommandLine|contains:
            - 'Invoke-Expression'
            - 'IEX'
            - 'Invoke-WebRequest'
            - 'Invoke-RestMethod'
            - 'iwr '
    filter_microsoft:
        CommandLine|contains:
            - 'https://aka.ms/'
            - 'https://www.powershellgallery.com/'
    condition: selection_img and (selection_webclient or (selection_http and selection_iwr_exec)) and not filter_microsoft
falsepositives:
    - Legitimate software installers or CI/CD bootstrap scripts fetching modules over HTTPS
level: high
tags:
    - attack.execution
    - attack.command_and_control
    - attack.t1059.001
    - attack.t1105
