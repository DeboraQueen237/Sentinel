# License: MIT — Original rule authored for SENTINEL v2
title: LSASS Process Memory Credential Dumping
id: 6a100012-5e77-4b21-9c12-000000000012
status: stable
description: Detects attempts to dump LSASS process memory for credential harvesting using ProcDump, comsvcs.dll MiniDump, or known credential dumping command patterns.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_procdump_img:
        Image|contains:
            - 'procdump'
        CommandLine|contains:
            - 'lsass'
    selection_procdump_cli:
        CommandLine|contains|all:
            - 'procdump'
            - 'lsass'
    selection_comsvcs:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    selection_cred_tools:
        CommandLine|contains:
            - 'sekurlsa::logonpasswords'
            - 'sekurlsa::minidump'
            - 'lsadump::sam'
            - 'lsadump::secrets'
            - 'Out-Minidump'
            - 'nanodump'
    condition: 1 of selection_*
falsepositives:
    - Extremely rare kernel/security debugging sessions conducted by authorized engineers
level: critical
tags:
    - attack.credential_access
    - attack.t1003
    - attack.t1003.001
