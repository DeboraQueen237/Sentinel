title: PowerShell Encoded Command Execution
id: 6a100001-5e77-4b21-9c01-000000000001
status: stable
description: Detects execution of PowerShell with an encoded command switch (-EncodedCommand, -enc, -ec, -e) often used to conceal malicious payloads.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_enc:
        CommandLine|contains|windash:
            - ' -EncodedCommand '
            - ' -EncodedArguments '
            - ' -enc '
            - ' -en '
            - ' -ec '
            - ' -e '
    filter_sentinel:
        ParentImage|endswith:
            - '\Sentinel.Agent.exe'
    condition: selection_img and selection_enc and not filter_sentinel
falsepositives:
    - Legitimate administrative scripts or configuration management tools using Base64-encoded commands
level: high
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1059.001
    - attack.t1027
