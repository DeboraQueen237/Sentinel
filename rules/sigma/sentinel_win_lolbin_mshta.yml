title: Suspicious Mshta Proxy Execution
id: 6a100003-5e77-4b21-9c03-000000000003
status: stable
description: Detects abuse of mshta.exe to execute remote HTA files or inline VBScript/JavaScript payloads.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\mshta.exe'
    selection_cli:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'ftp://'
            - 'vbscript:'
            - 'javascript:'
            - 'about:'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\ProgramData\'
    condition: selection_img and selection_cli
falsepositives:
    - Rare legacy enterprise intranet HTA applications
level: high
tags:
    - attack.defense_evasion
    - attack.execution
    - attack.t1218.005
