title: Suspicious Executable Launched from Temp or Downloads Folder
id: 6a100006-5e77-4b21-9c06-000000000006
status: stable
description: Detects execution of binaries or scripts directly from user-writable staging directories such as Downloads, Temp or Public folders.
author: Sentinel Project Contributors
license: MIT
date: 2026-01-15
logsource:
    product: windows
    category: process_creation
detection:
    selection_folder:
        Image|contains:
            - '\Downloads\'
            - '\AppData\Local\Temp\'
            - '\Windows\Temp\'
            - '\Users\Public\'
    selection_ext:
        Image|endswith:
            - '.exe'
            - '.scr'
            - '.com'
            - '.pif'
            - '.bat'
            - '.cmd'
            - '.vbs'
            - '.js'
            - '.hta'
    filter_known_updaters:
        Image|contains:
            - '\Temp\chocolatey\'
            - '\Temp\winget\'
            - '\Temp\msedge_'
            - '\Temp\SentinelSetup'
    condition: selection_folder and selection_ext and not filter_known_updaters
falsepositives:
    - Self-extracting software installers downloaded by users into Downloads or Temp
level: medium
tags:
    - attack.execution
    - attack.t1204.002
